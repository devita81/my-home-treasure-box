name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc -b --noEmit

      - name: Build
        run: bun run build
        env:
          # When set (push to main with secret configured), Sentry plugin
          # uploads source maps. When empty (PR runs without secret access),
          # plugin skips upload and warns — build still succeeds.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # E2E smoke tests run against the production build (`bun run preview`).
      # Playwright auto-starts the preview server via its webServer config.
      - name: Install Playwright Browsers
        run: bunx playwright install chromium --with-deps

      - name: E2E tests
        run: bun run test:e2e
        env:
          # Credentials for the dedicated Supabase test user. Stored as
          # repository secrets (Settings → Secrets → Actions). Without
          # these, the auth.setup.ts step throws and authenticated specs
          # are skipped — public smoke specs still run.
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
